name: Daily Financial Systems News Digest

on:
  schedule:
    # Default delivery: 8:00 AM India time. Edit the hour/minute to change it.
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-financial-news-digest
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_MODEL: qwen2.5:3b
      MIN_RELEVANCE_SCORE: "6"
      LOOKBACK_HOURS: "48"
      MAX_ARTICLES: "80"
      BATCH_SIZE: "5"
      SEND_EMPTY_DIGEST: "false"
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Download model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Fetch, filter and email digest
        run: python daily_digest.py

      - name: Save processed-article state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update processed news state"
            git push
          fi

